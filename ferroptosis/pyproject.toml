[project]
name = "ferroptosis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "neuralProcessor314", email = "biologicalnpu314@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cellpose>=4.2.1.1",
    "numpy>=2.5.5",
    "pathlib>=1.0.1",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
ferroptosis = "ferroptosis:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
